on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  # Lets a run be re-triggered over the API, e.g. to retry a release whose
  # `release` job died before it created the release:
  #   cb actions dispatch thomasc/cb build.yml --ref v0.11.1
  # Dispatching on a tag ref runs the release job too (github.ref is the tag);
  # dispatching on master only rebuilds. Forgejo's web "Re-run all jobs" button
  # is session-only, so a token cannot drive it (see TODO.md).
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          # Full history + tags. build-aux/git-version.sh needs `git describe`
          # to report the real version; the default depth-1 fetch is --no-tags,
          # so a branch build falls back to a bogus 0.0.1-<sha>.
          fetch-depth: 0
          fetch-tags: true
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc libtls-dev pkg-config autoconf automake make
      - name: Build
        run: |
          autoreconf -fi
          ./configure
          make
      - name: Test
        run: make check
      - name: Prepare artifact
        run: |
          strip src/cb
          mkdir -p cb-linux-amd64
          cp src/cb cb-linux-amd64/cb
          cp COPYING cb-linux-amd64/COPYING
          cp README.md cb-linux-amd64/README.md
          tar czf cb-linux-amd64.tar.gz cb-linux-amd64
          make dist
          DIST=$(ls cb-*.tar.gz | grep -v linux | head -1)
          mv "$DIST" cb-source-dist.tar.gz
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: cb-linux-amd64
          path: cb-linux-amd64.tar.gz
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: cb-source-dist
          path: cb-source-dist.tar.gz

  build-windows:
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          # Full history + tags. build-aux/git-version.sh needs `git describe`
          # to report the real version; the default depth-1 fetch is --no-tags,
          # so a branch build falls back to a bogus 0.0.1-<sha>.
          fetch-depth: 0
          fetch-tags: true
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            mingw-w64 pkg-config autoconf automake make \
            wget ca-certificates zstd zip
      - name: Extract pre-built LibreSSL from MSYS2
        run: |
          mkdir -p /usr/x86_64-w64-mingw32
          cd /tmp
          wget -q https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-libressl-4.3.2-1-any.pkg.tar.zst
          zstd -d mingw-w64-x86_64-libressl-4.3.2-1-any.pkg.tar.zst -o libressl.tar
          tar xf libressl.tar
          cp -r mingw64/include/* /usr/x86_64-w64-mingw32/include/
          cp -r mingw64/lib/* /usr/x86_64-w64-mingw32/lib/
      - name: Build cb for Windows
        run: |
          autoreconf -fi
          ./configure \
            --host=x86_64-w64-mingw32 \
            PKG_CONFIG_PATH=/usr/x86_64-w64-mingw32/lib/libressl/pkgconfig \
            LIBTLS_CFLAGS="-I/usr/x86_64-w64-mingw32/include/libressl" \
            LIBTLS_LIBS="-L/usr/x86_64-w64-mingw32/lib/libressl -ltls -lssl -lcrypto -lws2_32"
          make
      - name: Prepare artifact
        run: |
          x86_64-w64-mingw32-strip src/cb.exe
          cp src/cb.exe cb-windows-amd64.exe
          cp /tmp/mingw64/bin/libretls-33.dll .
          cp /tmp/mingw64/bin/libressl-60.dll .
          cp /tmp/mingw64/bin/librecrypto-57.dll .
          zip cb-windows-amd64.zip \
            cb-windows-amd64.exe \
            libretls-33.dll \
            libressl-60.dll \
            librecrypto-57.dll \
            COPYING \
            README.md
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: cb-windows-amd64
          path: cb-windows-amd64.zip

  build-macos:
    strategy:
      matrix:
        include:
          # arch is the artifact name (Go-style), libressl_arch is the GNU
          # triple the pre-built static libtls.a package is named after.
          - arch: amd64
            libressl_arch: x86_64
            zig_target: x86_64-macos
            host: x86_64-apple-darwin
          - arch: arm64
            libressl_arch: aarch64
            zig_target: aarch64-macos
            host: aarch64-apple-darwin
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          # Full history + tags. build-aux/git-version.sh needs `git describe`
          # to report the real version; the default depth-1 fetch is --no-tags,
          # so a branch build falls back to a bogus 0.0.1-<sha>.
          fetch-depth: 0
          fetch-tags: true
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget ca-certificates xz-utils curl make file
      - name: Install zig
        run: |
          curl -L https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig.tar.xz
          tar xJf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      - name: Download pre-built LibreSSL for macOS
        run: |
          wget -q https://codeberg.org/api/packages/thomasc/generic/libressl-macos/4.3.2/libressl-4.3.2-macos-${{ matrix.libressl_arch }}.tar.gz
          mkdir -p /tmp/libressl-macos
          tar xzf libressl-4.3.2-macos-${{ matrix.libressl_arch }}.tar.gz -C /tmp/libressl-macos
      - name: Build cb for macOS
        run: |
          autoreconf -fi
          CC="zig cc -target ${{ matrix.zig_target }}" ./configure --host=${{ matrix.host }} \
            LIBTLS_CFLAGS="-I/tmp/libressl-macos/include" \
            LIBTLS_LIBS="-L/tmp/libressl-macos/lib -ltls" \
            --disable-werror
          make
      - name: Verify binary architecture
        run: |
          file src/cb
          case "${{ matrix.arch }}" in
            amd64) want=x86_64 ;;
            arm64) want=arm64 ;;
          esac
          file src/cb | grep -q "Mach-O 64-bit $want executable"
      - name: Prepare artifact
        run: |
          mkdir -p cb-darwin-${{ matrix.arch }}
          cp src/cb cb-darwin-${{ matrix.arch }}/cb
          cp COPYING cb-darwin-${{ matrix.arch }}/COPYING
          cp README.md cb-darwin-${{ matrix.arch }}/README.md
          tar czf cb-darwin-${{ matrix.arch }}.tar.gz cb-darwin-${{ matrix.arch }}
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: cb-darwin-${{ matrix.arch }}
          path: cb-darwin-${{ matrix.arch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: codeberg-tiny
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: cb-linux-amd64
          path: release
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: cb-windows-amd64
          path: release
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: cb-darwin-amd64
          path: release
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: cb-darwin-arm64
          path: release
      - uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: cb-source-dist
          path: release
      - name: Rename artifacts and generate checksums
        run: |
          cd release
          V=${{ github.ref_name }}
          # The build jobs pack the tarballs with an unversioned top-level
          # directory (cb-linux-amd64/, cb-darwin-arm64/). Repack them so the
          # directory matches the versioned asset name, which is what users
          # expect to land in when they extract the archive.
          for plat in linux-amd64 darwin-amd64 darwin-arm64; do
            mkdir -p "cb-${V}-${plat}"
            tar xzf "cb-${plat}.tar.gz" -C "cb-${V}-${plat}" --strip-components=1
            tar czf "cb-${V}-${plat}.tar.gz" "cb-${V}-${plat}"
            rm -rf "cb-${V}-${plat}" "cb-${plat}.tar.gz"
          done
          # The Windows zip is flat (cb-windows-amd64.exe, the DLLs and the docs
          # all sit at the root), so it only needs the rename.
          mv cb-windows-amd64.zip cb-${V}-windows-amd64.zip
          mv cb-source-dist.tar.gz cb-${V}-source.tar.gz
          sha256sum cb-${V}-linux-amd64.tar.gz > cb-${V}-linux-amd64.tar.gz.sha256
          sha256sum cb-${V}-windows-amd64.zip > cb-${V}-windows-amd64.zip.sha256
          sha256sum cb-${V}-darwin-amd64.tar.gz > cb-${V}-darwin-amd64.tar.gz.sha256
          sha256sum cb-${V}-darwin-arm64.tar.gz > cb-${V}-darwin-arm64.tar.gz.sha256
          sha256sum cb-${V}-source.tar.gz > cb-${V}-source.tar.gz.sha256
      - uses: https://code.forgejo.org/actions/forgejo-release@v2.13.1
        with:
          direction: upload
          url: https://codeberg.org
          tag: ${{ github.ref_name }}
          release-dir: release
          token: ${{ secrets.GITHUB_TOKEN }}
